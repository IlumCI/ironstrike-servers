name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Build
        run: dotnet build IronstrikeServers/IronstrikeServers.csproj -c Release --nologo

      - name: Package
        run: ./package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: IronstrikeServers
          path: dist/*.zip
          if-no-files-found: error
