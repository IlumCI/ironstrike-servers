name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Build
        run: dotnet build IronstrikeServers/IronstrikeServers.csproj -c Release --nologo

      - name: Package
        run: ./package.sh

      - name: Resolve tag
        id: t
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.t.outputs.tag }}" dist/*.zip \
            --title "${{ steps.t.outputs.tag }}" \
            --notes-file .github/RELEASE_NOTES.md \
            --latest \
            --repo "$GITHUB_REPOSITORY" || \
          gh release upload "${{ steps.t.outputs.tag }}" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
